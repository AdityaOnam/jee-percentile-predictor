[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jee-percentile-predictor"
version = "1.1.0"
description = "Predict JEE Main percentile from raw marks and paper difficulty - a small-data statistical learning project."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AdityaOnam" }]
keywords = ["jee-main", "percentile", "ridge-regression", "isotonic-regression", "data-science"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
app = ["streamlit>=1.32", "altair>=5"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
jee-pct = "jee_percentile.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
