<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="JEE Main Percentile Predictor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.55" stop-color="#312E81"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#A5B4FC" stop-opacity="0.32"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="18" fill="url(#grid)"/>

  <!-- percentile curves: same marks, different percentile -->
  <g fill="none" stroke-linecap="round">
    <path d="M690 300 C 770 285, 820 150, 900 110 S 1080 62, 1240 52 L 1240 92 C 1080 104, 990 140, 940 175 S 820 300, 760 305 Z" fill="url(#band)" stroke="none"/>
    <path d="M700 300 C 780 280, 830 140, 910 105 S 1080 60, 1240 50" stroke="#2DD4BF" stroke-width="3" stroke-opacity="0.9"/>
    <path d="M740 300 C 820 280, 870 160, 950 125 S 1100 75, 1240 66" stroke="#A5B4FC" stroke-width="3"/>
    <path d="M790 300 C 870 285, 920 180, 1000 140 S 1130 88, 1240 80" stroke="#FBBF24" stroke-width="3" stroke-opacity="0.9"/>
    <path d="M840 300 C 920 290, 970 200, 1050 158 S 1160 104, 1240 96" stroke="#F472B6" stroke-width="2.5" stroke-opacity="0.75"/>
    <line x1="960" y1="40" x2="960" y2="300" stroke="#FFFFFF" stroke-opacity="0.35" stroke-dasharray="4 6"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="960" cy="86.7" r="6" fill="#2DD4BF"/>
    <circle cx="960" cy="120.7" r="6" fill="#A5B4FC"/>
    <circle cx="960" cy="166.5" r="6" fill="#FBBF24"/>
    <circle cx="960" cy="227.4" r="6" fill="#F472B6"/>
    <text x="972" y="318" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill-opacity="0.6">same marks · four different papers</text>
  </g>

  <!-- copy -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#FFFFFF">
    <text x="64" y="84" font-size="15" letter-spacing="3" fill="#A5B4FC" font-weight="600">DATA SCIENCE · STATISTICAL LEARNING</text>
    <text x="64" y="140" font-size="48" font-weight="800">JEE Main Percentile</text>
    <text x="64" y="194" font-size="48" font-weight="800">Predictor</text>
    <text x="64" y="232" font-size="18" fill-opacity="0.78">Raw marks + paper difficulty → percentile, with a calibrated range.</text>

    <g font-size="14" font-weight="600">
      <rect x="64" y="260" width="170" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.12"/>
      <text x="149" y="284" text-anchor="middle">0.72 pt LOSO error</text>
      <rect x="246" y="260" width="140" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.12"/>
      <text x="316" y="284" text-anchor="middle">41 real shifts</text>
      <rect x="398" y="260" width="196" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.12"/>
      <text x="496" y="284" text-anchor="middle">80% band · 80% coverage</text>
    </g>
  </g>
</svg>
