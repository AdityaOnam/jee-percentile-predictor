name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests (incl. sklearn vs stdlib parity)
        run: pytest -q
      - name: Results are reproducible
        run: |
          jee-pct evaluate
          python -c "import json; m = json.load(open('reports/metrics.json')); mae = m['leaderboard'][-1]['pct_mae']; assert abs(mae - 0.7161) < 1e-3, mae; print('LOSO MAE', round(mae, 4))"
